<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مختبر الشخصيات</title>
<base href="../">
<style>
  /* أداة تطوير: تعرض شخصية وحدة كبيرة وتحرّكها بنفس كود الموقع (hk-rig.js).
     ?who=amna&mode=idle|walk|wave|shy|joy|look|sit|blink&t=1.2&flip=1&h=90  */
  body{margin:0;background:#2f6f8f;font:14px sans-serif;color:#fff}
  .stage{position:relative;height:100vh;display:grid;place-items:end center;overflow:hidden}
  .tc{position:relative;--h:60;font-size:1.3vh;padding-bottom:4vh}
  .tc.fl .rig{transform-origin:50% 100%}
  .rig{position:relative;height:calc(var(--h)*1em);transform-origin:50% 100%}
  .rig .rp{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;max-width:none}
  .flipw.fl{transform:scaleX(-1)}
  .ground{position:absolute;left:0;right:0;bottom:0;height:4vh;background:#1d4c62}
  .label{position:absolute;top:8px;right:8px}
</style>
</head>
<body>
<div class="stage"><div class="ground"></div><div class="tc"><div class="flipw"><div id="c"></div></div></div><div class="label"></div></div>
<script src="story/rig-data.js"></script>
<script src="story/hk-rig.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const who = q.get("who") || "amna", mode = q.get("mode") || "idle", until = +(q.get("t") || 1.5);
  const box = document.getElementById("c");
  box.innerHTML = TRig.html(who);
  if (q.get("flip")) document.querySelector(".flipw").classList.add("fl");
  if (q.get("h")) document.querySelector(".tc").style.setProperty("--h", q.get("h"));
  const c = { who, x: 0, y: 0, face: 1, anim: mode === "sit" ? "sit" : "idle" };
  TRig.attach(c, box);
  if (mode === "wave") TRig.wave(c, 9); if (mode === "shy") TRig.shy(c); if (mode === "joy") TRig.joy(c); if (mode === "look") TRig.look(c, 1.4);
  // محاكاة ثابتة الخطوة حتى تطلع اللقطة نفسها كل مرة
  const dt = 1 / 60; let t = 0;
  while (t < until) { if (mode === "walk") c.x += 17 * dt; TRig.update(c, dt, false); t += dt; }
  if (mode === "blink") { c.rig.blink = 0; TRig.update(c, .085, false); }   // الجفن مسدود بنص الرمشة
  document.querySelector(".label").textContent = `${who} · ${mode} · t=${until}`;
  window.ready = true;
</script>
</body>
</html>
